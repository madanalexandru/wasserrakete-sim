# Wasserraketen-Simulation: Services
# Datenbank (PostgreSQL), Migration (Alembic), Backend (FastAPI), Frontend (Nginx)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bringt die Tabellen auf den neuesten Stand (alembic upgrade head) und
  # beendet sich dann. Ist die Datenbank schon aktuell, ändert sich nichts.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DEBUG: ${DEBUG}
      # Zugangsdaten aus .env; app/db.py baut daraus die Verbindungsadresse
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      # Startet erst, wenn die Migration fehlerfrei beendet ist (Exitcode 0)
      migrate:
        condition: service_completed_successfully

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db-data: