# Wasserraketen-Simulation: Services
# Datenbank (PostgreSQL), Migration (Alembic), Backend (FastAPI), Frontend (Nginx)
#
# Images mit Tag und Digest: Der Tag dient nur zum Lesen, der Digest
# (@sha256) legt das Image bitgenau fest, auch wenn der Tag später auf ein
# neueres Image zeigt. Aktualisieren nur bewusst und mit erneuten Tests.

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bringt die Tabellen auf den neuesten Stand (alembic upgrade head) und
  # beendet sich dann. Ist die Datenbank schon aktuell, ändert sich nichts.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DEBUG: ${DEBUG}
      # Zugangsdaten aus .env; app/db.py baut daraus die Verbindungsadresse
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      # Startet erst, wenn die Migration fehlerfrei beendet ist (Exitcode 0)
      migrate:
        condition: service_completed_successfully

  frontend:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # --- Nur für Tests (Profil "test"): docker compose --profile test run --rm test
  # Ein normales "docker compose up" startet diese beiden Services nicht.

  # Eigene Testdatenbank, getrennt von den echten Daten. Daten nur im
  # Arbeitsspeicher (tmpfs): weg, sobald der Container stoppt. Kein Port nach
  # außen, deshalb feste Zugangsdaten ohne Geheimnis.
  db-test:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    profiles: ["test"]
    environment:
      POSTGRES_DB: wasserrakete_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Alle Tests (SQLite und PostgreSQL) im gleichen Python-Image wie das Backend.
  test:
    image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      INTEGRATION_DB: "1"
      POSTGRES_DB: wasserrakete_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: db-test
    command: ["sh", "-c", "pip install -q -r requirements-dev.txt && python -W error -m pytest -q -p no:cacheprovider"]
    depends_on:
      db-test:
        condition: service_healthy

  # --- Nur für Experimente (Profil "experiment"), z. B.:
  # docker compose --profile experiment run --rm experiment python cw_sensitivitaet/run.py
  # Spricht die API über Nginx an wie der Browser; Ergebnisse landen in ./experiments.
  experiment:
    image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    profiles: ["experiment"]
    working_dir: /experiments
    volumes:
      - ./experiments:/experiments
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      API_BASE: http://frontend/api
    depends_on:
      - frontend

volumes:
  db-data: