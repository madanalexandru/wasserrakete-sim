# Wasserraketen-Simulation: Services
# Datenbank (PostgreSQL), Migration (Alembic), Backend (FastAPI), Frontend (Nginx)
#
# Images mit Tag und Digest: Der Tag dient nur zum Lesen, der Digest
# (@sha256) legt das Image bitgenau fest, auch wenn der Tag später auf ein
# neueres Image zeigt. Aktualisieren nur bewusst und mit erneuten Tests.

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bringt die Tabellen auf den neuesten Stand (alembic upgrade head) und
  # beendet sich dann. Ist die Datenbank schon aktuell, ändert sich nichts.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DEBUG: ${DEBUG}
      # Zugangsdaten aus .env; app/db.py baut daraus die Verbindungsadresse
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      # Startet erst, wenn die Migration fehlerfrei beendet ist (Exitcode 0)
      migrate:
        condition: service_completed_successfully

  frontend:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db-data: