# Nginx: liefert das Frontend aus und leitet /api/ an FastAPI weiter.

server {
    listen 80;

    # Statische Dateien (index.html usw.) aus dem Ordner frontend/
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Alles unter /api/ geht an den Service "backend" auf Port 8000.
    # Ohne Schrägstrich am Ende bleibt der Pfad /api/... erhalten.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}